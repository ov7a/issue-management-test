name: Triage new issues and PRs

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: gradle/issue-management-action/new-triage@7f889052db1651b0ead39c597cf4a1ef9493dc63
