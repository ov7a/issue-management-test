# Throwaway: end-to-end check that gradle/actions reports the Gradle build tool itself as a
# dependency. Gradle 5.2.1 is vulnerable to GHSA-hhr2-f668-ff2w (< 6.0) and
# GHSA-pprq-4488-wgqx (>= 1.4, < 5.4.0). The version is selected by the wrapper, so the build
# tool is reported against gradle/wrapper/gradle-wrapper.properties.
name: Gradle dependency submission

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-submission-wrapper:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: 11
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@8bb6f89d5c166ea302b7666e25c7f52b8bd599f1
      with:
        build-root-directory: gradle-sample-wrapper
